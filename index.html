<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軽々 Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
  padding: 18px;
  font-size: 24px;
  font-weight: bold;
  border-bottom: 1px solid #292929;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #444;
  background: #181818;
  color: white;
  font-size: 16px;
}

button {
  padding: 15px 22px;
  border: 0;
  border-radius: 10px;
  background: #ffffff;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.player {
  width: 100%;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
  max-height: 70vh;
}

.message {
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  background: #181818;
  color: #ccc;
  display: none;
}

.example {
  margin-top: 15px;
  color: #888;
  font-size: 14px;
}

@media (max-width: 600px) {
  .input-area {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  header {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  軽々 Player
</header>

<main>

  <div class="input-area">
    <input
      id="videoUrl"
      type="url"
      placeholder="動画URL（MP4など）を入力"
      autocomplete="off"
    >
    <button onclick="playVideo()">再生</button>
  </div>

  <div class="player">
    <video id="video" controls playsinline preload="metadata"></video>
  </div>

  <div id="message" class="message"></div>

  <div class="example">
    MP4など、ブラウザで直接再生できる動画URLに対応しています。
  </div>

</main>

<script>
const input = document.getElementById("videoUrl");
const video = document.getElementById("video");
const message = document.getElementById("message");

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

function hideMessage() {
  message.textContent = "";
  message.style.display = "none";
}

function playVideo() {
  const url = input.value.trim();

  hideMessage();

  if (!url) {
    showMessage("動画URLを入力してください。");
    return;
  }

  try {
    new URL(url);
  } catch {
    showMessage("正しい動画URLを入力してください。");
    return;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.src = url;
  video.load();

  video.play().catch(() => {
    showMessage("動画を読み込みました。再生ボタンを押してください。");
  });
}

video.addEventListener("error", () => {
  showMessage(
    "このURLの動画を再生できませんでした。MP4など、ブラウザで直接再生できる動画URLを使用してください。"
  );
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    playVideo();
  }
});
</script>

</body>
</html>
